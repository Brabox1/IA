services:
  agent:
    build: .
    container_name: nexus-agent
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - ./sessions:/app/sessions
      - ./database:/app/database
      - ./logs:/app/logs
      - ./media:/app/media
    depends_on:
      - redis
    stdin_open: true
    tty: true

  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
